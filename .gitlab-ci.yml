workflow:
  rules:
    - changes:
        - .gitlab-ci.yml
        - ansible/**/*
        - clo5-backend-master/**/*
        - clo5-front-main/**/*
        - deploy/**/*
        - docker/**/*
        - tests/**/*
        - compose.yml
      when: always
    - when: never

stages:
  - test
  - build
  - deploy_preprod
  - test_preprod
  - deploy_green
  - test_green
  - switch_prod

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_TLS_CERTDIR: ""
  SWARM_MANAGER_IP: 172.16.248.64
  NFS_SERVER: 172.16.248.64
  NFS_EXPORTS_ROOT: /srv/nfs/quantum-motors

# Do not force a default tag: ETNA shared runners are usually untagged.
# Deployment jobs keep explicit swarm-manager tags below.

.docker_job:
  image: docker:24.0.7-cli
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

.docker_deploy_job:
  image: docker:24.0.7-cli
  before_script:
    - export DEPLOY_REGISTRY_USER="${REGISTRY_PULL_USER:-$CI_REGISTRY_USER}"
    - export DEPLOY_REGISTRY_PASSWORD="${REGISTRY_PULL_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    - docker login -u "$DEPLOY_REGISTRY_USER" -p "$DEPLOY_REGISTRY_PASSWORD" "$CI_REGISTRY"

.docker_host_job:
  image: docker:24.0.7-cli

.retryable_test_job:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
      - unknown_failure

etna_smoke:
  stage: test
  image: alpine:3.20
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: on_success
    - when: never
  script:
    - echo "ETNA CI reachable"
    - echo "Heavy jobs are intentionally skipped on ETNA shared runners."

test_backend:
  stage: test
  image: node:20-bookworm-slim
  extends: .retryable_test_job
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: never
    - when: on_success
  services:
    - name: mariadb:11
      alias: mysql
      variables:
        MARIADB_ROOT_PASSWORD: root
        MARIADB_DATABASE: quantum_motors
  script:
    - cd clo5-backend-master
    - |
      retry_cmd() {
        max_attempts="$1"
        shift
        attempt=1
        until "$@"; do
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "Command failed after ${attempt} attempts: $*"
            return 1
          fi
          echo "Retrying (${attempt}/${max_attempts}): $*"
          attempt=$((attempt + 1))
          sleep 5
        done
      }
      retry_cmd 3 apt-get update
      retry_cmd 3 apt-get install -y --no-install-recommends openssl
      retry_cmd 3 corepack enable
      retry_cmd 3 yarn install --immutable
    - cp .env.test.example .env.test
    - sed -i 's|mysql://quantum:quantum@127.0.0.1:3306/quantum_motors_test|mysql://root:root@mysql:3306/quantum_motors|' .env.test
    - yarn test

lint_backend:
  stage: test
  image: node:20-bookworm-slim
  extends: .retryable_test_job
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: never
    - when: on_success
  script:
    - cd clo5-backend-master
    - |
      retry_cmd() {
        max_attempts="$1"
        shift
        attempt=1
        until "$@"; do
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "Command failed after ${attempt} attempts: $*"
            return 1
          fi
          echo "Retrying (${attempt}/${max_attempts}): $*"
          attempt=$((attempt + 1))
          sleep 5
        done
      }
      retry_cmd 3 corepack enable
      retry_cmd 3 yarn install --immutable
    - yarn lint

lint_front:
  stage: test
  image: node:18-bookworm-slim
  extends: .retryable_test_job
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: never
    - when: on_success
  script:
    - cd clo5-front-main
    - |
      retry_cmd() {
        max_attempts="$1"
        shift
        attempt=1
        until "$@"; do
          if [ "$attempt" -ge "$max_attempts" ]; then
            echo "Command failed after ${attempt} attempts: $*"
            return 1
          fi
          echo "Retrying (${attempt}/${max_attempts}): $*"
          attempt=$((attempt + 1))
          sleep 5
        done
      }
      retry_cmd 3 corepack enable
      retry_cmd 3 yarn install --frozen-lockfile
    - yarn lint

build_backend:
  stage: build
  extends: .docker_job
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: never
    - when: on_success
  needs:
    - test_backend
    - lint_backend
  script:
    - docker build --pull -t "$BACKEND_IMAGE:$IMAGE_TAG" ./clo5-backend-master
    - docker push "$BACKEND_IMAGE:$IMAGE_TAG"

build_frontend:
  stage: build
  extends: .docker_job
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: never
    - when: on_success
  needs:
    - lint_front
  script:
    - docker build --pull --build-arg NEXT_PUBLIC_API_URL=/api -t "$FRONTEND_IMAGE:$IMAGE_TAG" ./clo5-front-main
    - docker push "$FRONTEND_IMAGE:$IMAGE_TAG"

deploy_preprod:
  stage: deploy_preprod
  extends: .docker_deploy_job
  tags:
    - swarm-manager
  needs:
    - build_backend
    - build_frontend
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
  script:
    - export DB_ROOT_PASSWORD="$PREPROD_DB_ROOT_PASSWORD"
    - export DB_PASSWORD="$PREPROD_DB_PASSWORD"
    - export ADMIN_PASSWORD="$BACKEND_ADMIN_PASSWORD"
    - |
      for image in "$BACKEND_IMAGE:$IMAGE_TAG" "$FRONTEND_IMAGE:$IMAGE_TAG"; do
        attempt=0
        until docker pull "$image"; do
          attempt=$((attempt + 1))
          if [ "$attempt" -ge 20 ]; then
            echo "Failed to pull $image after $attempt attempts"
            exit 1
          fi
          echo "Retrying pull for $image ($attempt/20)"
          sleep 3
        done
      done
    - docker stack rm preprod || true
    - while docker stack ls --format '{{.Name}}' | grep -qx 'preprod'; do sleep 2; done
    - docker run --rm -v "$NFS_EXPORTS_ROOT:/nfs" docker:24.0.7-cli sh -c 'rm -rf /nfs/preprod/mariadb && mkdir -p /nfs/preprod/mariadb'
    - docker stack deploy --resolve-image=never --with-registry-auth -c deploy/preprod.yml preprod
    - until docker service ls --format '{{.Name}} {{.Replicas}}' | grep -q '^preprod_mariadb-preprod 1/1$'; do sleep 5; done
    - until docker service ls --format '{{.Name}} {{.Replicas}}' | grep -q '^preprod_api-preprod 1/1$'; do sleep 5; done
    - until docker service ls --format '{{.Name}} {{.Replicas}}' | grep -q '^preprod_front-preprod 1/1$'; do sleep 5; done

test_preprod:
  stage: test_preprod
  extends: .docker_host_job
  tags:
    - swarm-manager
  needs:
    - deploy_preprod
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
  script:
    - docker run --rm --network host -i curlimages/curl:8.7.1 sh -s -- "http://127.0.0.1" preprod.quantum.local api-preprod.quantum.local < tests/functional/smoke.sh
    - docker run --rm --network host -i curlimages/curl:8.7.1 sh -s -- "http://127.0.0.1:3100" preprod < tests/functional/log_queries.sh

bootstrap_prod_blue:
  stage: deploy_green
  extends: .docker_deploy_job
  tags:
    - swarm-manager
  needs:
    - build_backend
    - build_frontend
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - export DB_ROOT_PASSWORD="$PROD_DB_ROOT_PASSWORD"
    - export DB_PASSWORD="$PROD_DB_PASSWORD"
    - export ADMIN_PASSWORD="$BACKEND_ADMIN_PASSWORD"
    - |
      for image in "$BACKEND_IMAGE:$IMAGE_TAG" "$FRONTEND_IMAGE:$IMAGE_TAG"; do
        attempt=0
        until docker pull "$image"; do
          attempt=$((attempt + 1))
          if [ "$attempt" -ge 20 ]; then
            echo "Failed to pull $image after $attempt attempts"
            exit 1
          fi
          echo "Retrying pull for $image ($attempt/20)"
          sleep 3
        done
      done
    - |
      if docker service ls --format '{{.Name}}' | grep -qx 'prod-db_mariadb-prod'; then
        echo "prod-db_mariadb-prod already exists, skipping prod-db deploy"
      else
        docker stack deploy --resolve-image=never --with-registry-auth -c deploy/prod-db.yml prod-db
      fi
    - docker stack deploy --resolve-image=never --with-registry-auth -c deploy/prod-blue-live.yml prod-live
    - until docker service ls --format '{{.Name}} {{.Replicas}}' | grep -q '^prod-db_mariadb-prod 1/1$'; do sleep 5; done
    - until docker service ls --format '{{.Name}} {{.Replicas}}' | grep -q '^prod-live_api-prod-blue 1/1$'; do sleep 5; done
    - until docker service ls --format '{{.Name}} {{.Replicas}}' | grep -q '^prod-live_front-prod-blue 1/1$'; do sleep 5; done

deploy_green:
  stage: deploy_green
  extends: .docker_deploy_job
  tags:
    - swarm-manager
  needs:
    - test_preprod
    - build_backend
    - build_frontend
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - export DB_ROOT_PASSWORD="$PROD_DB_ROOT_PASSWORD"
    - export DB_PASSWORD="$PROD_DB_PASSWORD"
    - export ADMIN_PASSWORD="$BACKEND_ADMIN_PASSWORD"
    - |
      for image in "$BACKEND_IMAGE:$IMAGE_TAG" "$FRONTEND_IMAGE:$IMAGE_TAG"; do
        attempt=0
        until docker pull "$image"; do
          attempt=$((attempt + 1))
          if [ "$attempt" -ge 20 ]; then
            echo "Failed to pull $image after $attempt attempts"
            exit 1
          fi
          echo "Retrying pull for $image ($attempt/20)"
          sleep 3
        done
      done
    - |
      if docker service ls --format '{{.Name}}' | grep -qx 'prod-db_mariadb-prod'; then
        echo "prod-db_mariadb-prod already exists, skipping prod-db deploy"
      else
        docker stack deploy --resolve-image=never --with-registry-auth -c deploy/prod-db.yml prod-db
      fi
    - docker stack deploy --resolve-image=never --with-registry-auth -c deploy/prod-green.yml prodgreen
    - until docker service ls --format '{{.Name}} {{.Replicas}}' | grep -q '^prod-db_mariadb-prod 1/1$'; do sleep 5; done
    - until docker service ls --format '{{.Name}} {{.Replicas}}' | grep -q '^prodgreen_api-prod-green 1/1$'; do sleep 5; done
    - until docker service ls --format '{{.Name}} {{.Replicas}}' | grep -q '^prodgreen_front-prod-green 1/1$'; do sleep 5; done

test_green:
  stage: test_green
  extends: .docker_host_job
  tags:
    - swarm-manager
  needs:
    - deploy_green
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - docker run --rm --network host -i curlimages/curl:8.7.1 sh -s -- "http://127.0.0.1" front-green.quantum.local api-green.quantum.local < tests/functional/smoke.sh

switch_prod:
  stage: switch_prod
  extends: .docker_deploy_job
  tags:
    - swarm-manager
  needs:
    - test_green
  rules:
    - if: '$CI_SERVER_HOST == "rendu-git.etna-alternance.net"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - export DB_PASSWORD="$PROD_DB_PASSWORD"
    - export ADMIN_PASSWORD="$BACKEND_ADMIN_PASSWORD"
    - |
      for image in "$BACKEND_IMAGE:$IMAGE_TAG" "$FRONTEND_IMAGE:$IMAGE_TAG"; do
        attempt=0
        until docker pull "$image"; do
          attempt=$((attempt + 1))
          if [ "$attempt" -ge 20 ]; then
            echo "Failed to pull $image after $attempt attempts"
            exit 1
          fi
          echo "Retrying pull for $image ($attempt/20)"
          sleep 3
        done
      done
    - docker stack deploy --resolve-image=never --prune --with-registry-auth -c deploy/prod-green-live.yml prod-live
    - docker stack rm prodgreen || true
    - until docker service ls --format '{{.Name}} {{.Replicas}}' | grep -q '^prod-live_api-prod-green 1/1$'; do sleep 5; done
    - until docker service ls --format '{{.Name}} {{.Replicas}}' | grep -q '^prod-live_front-prod-green 1/1$'; do sleep 5; done
    - docker run --rm --network host -i curlimages/curl:8.7.1 sh -s -- "http://127.0.0.1" front.quantum.local api.quantum.local < tests/functional/smoke.sh
