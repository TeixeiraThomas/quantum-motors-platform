- name: Install Docker stack Python dependencies
  ansible.builtin.apt:
    name:
      - python3-jsondiff
    state: present
    update_cache: true

- name: Ensure Loki data directory exists on the logging node
  ansible.builtin.file:
    path: "{{ loki_data_dir }}"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0755"
  delegate_to: "{{ groups['logging_nodes'][0] }}"
  run_once: true

- name: Ensure Alloy state directory exists on every swarm node
  ansible.builtin.file:
    path: "{{ alloy_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0777"
  delegate_to: "{{ item }}"
  loop: "{{ groups['swarm_managers'] + groups['swarm_workers'] }}"
  run_once: true

- name: Ensure Grafana logs data directory exists on the logging node
  ansible.builtin.file:
    path: "{{ grafana_logs_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0777"
  delegate_to: "{{ groups['logging_nodes'][0] }}"
  run_once: true

- name: Ensure logging stack directory exists
  ansible.builtin.file:
    path: /opt/quantum-motors/deploy/logging
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy logging stack definition
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/logging.yml"
    dest: /opt/quantum-motors/deploy/logging.yml
    owner: root
    group: root
    mode: "0644"
  register: logging_stack_definition

- name: Copy Loki configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/logging/loki-config.yml"
    dest: /opt/quantum-motors/deploy/logging/loki-config.yml
    owner: root
    group: root
    mode: "0644"
  register: logging_loki_configuration

- name: Copy Alloy configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/logging/config.alloy"
    dest: /opt/quantum-motors/deploy/logging/config.alloy
    owner: root
    group: root
    mode: "0644"
  register: logging_alloy_configuration

- name: Copy Grafana datasource configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../deploy/logging/grafana-datasource.yml"
    dest: /opt/quantum-motors/deploy/logging/grafana-datasource.yml
    owner: root
    group: root
    mode: "0644"
  register: logging_grafana_datasource_configuration

- name: Compute desired logging deployment hash
  ansible.builtin.shell: >-
    sha256sum
    /opt/quantum-motors/deploy/logging.yml
    /opt/quantum-motors/deploy/logging/loki-config.yml
    /opt/quantum-motors/deploy/logging/config.alloy
    /opt/quantum-motors/deploy/logging/grafana-datasource.yml
    | sha256sum
    | awk '{print $1}'
  register: logging_deployment_hash
  changed_when: false

- name: Check current logging deployment hash
  ansible.builtin.stat:
    path: /opt/quantum-motors/deploy/logging/.deployment-hash
  register: logging_deployment_hash_file

- name: Read current logging deployment hash
  ansible.builtin.slurp:
    path: /opt/quantum-motors/deploy/logging/.deployment-hash
  register: logging_applied_hash
  when: logging_deployment_hash_file.stat.exists

- name: Determine whether logging stack must be recreated
  ansible.builtin.set_fact:
    logging_stack_recreate_required: >-
      {{
        (not logging_deployment_hash_file.stat.exists)
        or ((logging_applied_hash.content | default('') | b64decode | trim) != (logging_deployment_hash.stdout | trim))
      }}

- name: Recreate logging stack when Swarm configs changed
  community.docker.docker_stack:
    state: absent
    name: "{{ logging_stack_name }}"
  when: logging_stack_recreate_required

- name: Wait for logging stack removal
  ansible.builtin.command:
    argv:
      - docker
      - stack
      - ls
      - --format
      - "{{ '{{.Name}}' }}"
  register: logging_stack_list
  changed_when: false
  retries: 30
  delay: 2
  until: logging_stack_name not in logging_stack_list.stdout_lines
  when: logging_stack_recreate_required

- name: Deploy logging stack
  community.docker.docker_stack:
    state: present
    name: "{{ logging_stack_name }}"
    compose:
      - /opt/quantum-motors/deploy/logging.yml

- name: Persist logging deployment hash
  ansible.builtin.copy:
    content: "{{ logging_deployment_hash.stdout | trim }}\n"
    dest: /opt/quantum-motors/deploy/logging/.deployment-hash
    owner: root
    group: root
    mode: "0644"
