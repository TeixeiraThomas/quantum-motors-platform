- name: Create runner config directory
  ansible.builtin.file:
    path: /srv/gitlab-runner
    state: directory
    mode: "0755"

- name: Create runner cache directory
  ansible.builtin.file:
    path: /srv/gitlab-runner-cache
    state: directory
    mode: "0755"

- name: Check whether the runner is already registered
  ansible.builtin.stat:
    path: /srv/gitlab-runner/config.toml
  register: gitlab_runner_config

- name: Ensure GitLab Runner registration token is defined when registration is required
  ansible.builtin.assert:
    that:
      - gitlab_runner_registration_token | default('') | length > 0
    fail_msg: "gitlab_runner_registration_token must be defined before registering a new runner"
  when: not gitlab_runner_config.stat.exists
  no_log: true

- name: Build runner tag list
  ansible.builtin.set_fact:
    gitlab_runner_effective_tags: >-
      {{
        (
          gitlab_runner_tags
          + ((inventory_hostname in groups["swarm_managers"]) | ternary(["swarm-manager"], ["swarm-worker"]))
        ) | unique
      }}

- name: Register runner using a one-shot container
  community.docker.docker_container:
    name: gitlab-runner-register
    image: "{{ gitlab_runner_image }}"
    detach: false
    auto_remove: true
    command:
      - register
      - --non-interactive
      - --url
      - "{{ gitlab_runner_url }}"
      - --registration-token
      - "{{ gitlab_runner_registration_token }}"
      - --executor
      - docker
      - --docker-image
      - "{{ gitlab_runner_docker_image }}"
      - --description
      - "{{ inventory_hostname }}-runner"
      - --tag-list
      - "{{ gitlab_runner_effective_tags | join(',') }}"
      - --run-untagged=true
      - --locked=false
      - --docker-privileged=true
      - --docker-volumes
      - /var/run/docker.sock:/var/run/docker.sock
      - --docker-volumes
      - /cache
    volumes:
      - /srv/gitlab-runner:/etc/gitlab-runner
      - /srv/gitlab-runner-cache:/cache
  when: not gitlab_runner_config.stat.exists
  no_log: true

- name: Run gitlab runner container
  community.docker.docker_container:
    name: gitlab-runner
    image: "{{ gitlab_runner_image }}"
    state: started
    restart_policy: always
    volumes:
      - /srv/gitlab-runner:/etc/gitlab-runner
      - /srv/gitlab-runner-cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock
