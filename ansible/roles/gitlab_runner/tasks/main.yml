- name: Create runner config directory
  ansible.builtin.file:
    path: /srv/gitlab-runner
    state: directory
    mode: "0755"

- name: Create runner cache directory
  ansible.builtin.file:
    path: /srv/gitlab-runner-cache
    state: directory
    mode: "0755"

- name: Check whether the runner is already registered
  ansible.builtin.stat:
    path: /srv/gitlab-runner/config.toml
  register: gitlab_runner_config

- name: Read existing runner config
  ansible.builtin.slurp:
    path: /srv/gitlab-runner/config.toml
  register: gitlab_runner_config_raw
  when: gitlab_runner_config.stat.exists

- name: Extract configured runner URL
  ansible.builtin.set_fact:
    gitlab_runner_current_url: >-
      {{
        (
          (gitlab_runner_config_raw.content | b64decode)
          | regex_findall('(?m)^\s*url\s*=\s*"([^"]+)"')
          | first
          | default('')
        )
        if gitlab_runner_config.stat.exists
        else ''
      }}

- name: Determine whether runner registration is required
  ansible.builtin.set_fact:
    gitlab_runner_requires_registration: >-
      {{
        (not gitlab_runner_config.stat.exists)
        or (gitlab_runner_force_reregister | bool)
        or (
          gitlab_runner_config.stat.exists
          and (gitlab_runner_current_url | regex_replace('/+$', '')) != (gitlab_runner_url | regex_replace('/+$', ''))
        )
      }}

- name: Show runner registration decision (debug mode)
  ansible.builtin.debug:
    msg:
      config_exists: "{{ gitlab_runner_config.stat.exists }}"
      current_url: "{{ gitlab_runner_current_url | default('') }}"
      target_url: "{{ gitlab_runner_url }}"
      force_reregister: "{{ gitlab_runner_force_reregister | bool }}"
      requires_registration: "{{ gitlab_runner_requires_registration }}"
  when: gitlab_runner_debug_registration | bool

- name: Ensure GitLab Runner registration token is defined when registration is required
  ansible.builtin.assert:
    that:
      - gitlab_runner_registration_token | default('') | length > 0
    fail_msg: "gitlab_runner_registration_token must be defined before registering a new runner"
  when: gitlab_runner_requires_registration | bool
  no_log: true

- name: Reject placeholder runner tokens
  ansible.builtin.assert:
    that:
      - gitlab_runner_registration_token is not match('^<.*>$')
      - gitlab_runner_registration_token is not match('(?i).*(XXXX|YYYY|REAL|TOKEN|PLACEHOLDER|CHANGE[_-]?ME).*')
    fail_msg: >-
      Provided gitlab_runner_registration_token looks like a placeholder.
      Replace it with a real token from GitLab runner UI.
  when: gitlab_runner_requires_registration | bool

- name: Require runner authentication token for rendu GitLab
  ansible.builtin.assert:
    that:
      - gitlab_runner_registration_token is match('^glrt-')
    fail_msg: >-
      This GitLab endpoint requires the new runner workflow.
      Use a runner authentication token (starts with glrt-) created in the GitLab UI.
  when:
    - gitlab_runner_requires_registration | bool
    - "'rendu-git.etna-alternance.net' in gitlab_runner_url"

- name: Validate shape of rendu runner authentication token
  ansible.builtin.assert:
    that:
      - gitlab_runner_registration_token is match('^glrt-[A-Za-z0-9_-]{16,}$')
    fail_msg: >-
      Invalid runner authentication token format for rendu GitLab.
      Expected a real token starting with glrt- and a full random suffix.
  when:
    - gitlab_runner_requires_registration | bool
    - "'rendu-git.etna-alternance.net' in gitlab_runner_url"

- name: Build runner tag list
  ansible.builtin.set_fact:
    gitlab_runner_effective_tags: >-
      {{
        (
          gitlab_runner_tags
          + ((inventory_hostname in groups["swarm_managers"]) | ternary(["swarm-manager"], ["swarm-worker"]))
        ) | unique
      }}

- name: Detect runner token mode
  ansible.builtin.set_fact:
    gitlab_runner_is_auth_token: "{{ gitlab_runner_registration_token is match('^glrt-') }}"
    gitlab_runner_token_cli_option: "{{ (gitlab_runner_registration_token is match('^glrt-')) | ternary('--token', '--registration-token') }}"

- name: Build runner register command
  ansible.builtin.set_fact:
    gitlab_runner_register_command: >-
      {{
        [
          'register',
          '--non-interactive',
          '--url', gitlab_runner_url,
          gitlab_runner_token_cli_option, gitlab_runner_registration_token,
          '--executor', 'docker',
          '--docker-image', gitlab_runner_docker_image,
          '--description', inventory_hostname ~ '-runner'
        ]
        + (
          (not gitlab_runner_is_auth_token) | ternary(
            [
              '--tag-list', (gitlab_runner_effective_tags | join(',')),
              '--run-untagged=true',
              '--locked=false'
            ],
            []
          )
        )
        + [
          '--docker-privileged=true',
          '--docker-volumes', '/var/run/docker.sock:/var/run/docker.sock',
          '--docker-volumes', '/cache'
        ]
      }}

- name: Stop runner container before re-registration
  community.docker.docker_container:
    name: gitlab-runner
    state: stopped
  when:
    - gitlab_runner_requires_registration | bool
    - gitlab_runner_config.stat.exists

- name: Remove previous runner config before re-registration
  ansible.builtin.file:
    path: /srv/gitlab-runner/config.toml
    state: absent
  when:
    - gitlab_runner_requires_registration | bool
    - gitlab_runner_config.stat.exists

- name: Register runner using a one-shot container
  community.docker.docker_container:
    name: gitlab-runner-register
    image: "{{ gitlab_runner_image }}"
    detach: false
    auto_remove: "{{ not (gitlab_runner_debug_registration | bool) }}"
    command: "{{ gitlab_runner_register_command }}"
    volumes:
      - /srv/gitlab-runner:/etc/gitlab-runner
      - /srv/gitlab-runner-cache:/cache
  when: gitlab_runner_requires_registration | bool
  register: gitlab_runner_register_result
  no_log: "{{ not (gitlab_runner_debug_registration | bool) }}"

- name: Show runner registration output (debug mode)
  ansible.builtin.debug:
    var: gitlab_runner_register_result
  when:
    - gitlab_runner_requires_registration | bool
    - gitlab_runner_debug_registration | bool

- name: Run gitlab runner container
  community.docker.docker_container:
    name: gitlab-runner
    image: "{{ gitlab_runner_image }}"
    state: started
    restart_policy: always
    volumes:
      - /srv/gitlab-runner:/etc/gitlab-runner
      - /srv/gitlab-runner-cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock
