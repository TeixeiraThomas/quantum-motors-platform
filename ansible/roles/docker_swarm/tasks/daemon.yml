- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_swarm_daemon_config | to_nice_json }}"
    owner: root
    group: root
    mode: "0644"
  when: docker_swarm_daemon_config | length > 0
  notify:
    - Restart Docker

- name: Apply Docker daemon changes before swarm operations
  ansible.builtin.meta: flush_handlers
  when: docker_swarm_daemon_config | length > 0

- name: Ensure Docker service is enabled and started after daemon configuration
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
