- name: Install Docker packages and service
  ansible.builtin.import_tasks: packages.yml

- name: Configure the Docker daemon
  ansible.builtin.import_tasks: daemon.yml

- name: Configure the swarm cluster
  ansible.builtin.import_tasks: cluster.yml

- name: Label application nodes
  ansible.builtin.import_tasks: labels.yml

- name: Create swarm overlay networks
  ansible.builtin.import_tasks: networks.yml
