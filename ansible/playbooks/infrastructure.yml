- name: Deploy Docker Swarm cluster
  hosts: swarm_managers:swarm_workers
  become: true
  roles:
    - docker_swarm
    - nfs_storage
    - backup_ops

- name: Deploy Traefik
  hosts: swarm_managers
  become: true
  roles:
    - traefik

- name: Deploy centralized logging
  hosts: swarm_managers
  become: true
  roles:
    - logging_stack

- name: Deploy metrics monitoring and status page
  hosts: swarm_managers
  become: true
  roles:
    - monitoring_stack

- name: Deploy SonarQube
  hosts: swarm_managers
  become: true
  roles:
    - SonarQube
